# =============================================================================
#  Remko MXW  ->  ESPHome, WIRED over CN501 / XT      [PLAN B -- see ../README]
# -----------------------------------------------------------------------------
#  On the XT pin the indoor unit speaks exactly the same protocol as the IR
#  remote: Coolix, 24 bit, just as TTL levels instead of a 38 kHz carrier.
#  Hence: the stock ESPHome `coolix` platform plus a custom TTL transmitter.
#
#  Read docs/04-ir-protokoll-coolix.md before wiring anything. You need the
#  BC337 level shifter -- a 3.3 V GPIO does not reliably drive a 5 V CMOS input.
#
#  NEVER TESTED ON HARDWARE. `esphome config` and `esphome compile` pass; the
#  bidirectional XYE path made this one unnecessary before it was ever built.
# =============================================================================

substitutions:
  name: ac-livingroom-xt
  friendly_name: AC Living room

  # --- GPIO map (ESP32 WROOM-32, 30-pin) ------------------------------------
  # All four are "free" pins: no strapping, no flash, not input-only.
  xt_pin: GPIO25 # -> R1 4k7 -> base of BC337, collector -> CN501 "XT"
  rec_pin: GPIO26 # <- 10k/15k divider from CN501 "REC"  (optional)
  ir_led_pin: GPIO27 # -> IR LED (optional; only the external variant needs it)
  sda_pin: GPIO21 # BME280
  scl_pin: GPIO22 # BME280

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

# The custom component sits next to this file, in ../components/
external_components:
  - source:
      type: local
      path: ../components
    components: [remko_xt]

logger:
  level: INFO # raise to DEBUG or VERBOSE while bringing it up

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # No power saving: with it enabled the climate card reacts sluggishly.
  power_save_mode: none

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# =============================================================================
#  TRANSMITTERS
# =============================================================================

# Wired: TTL levels on XT. This is the actual control path.
remko_xt:
  - id: xt_tx
    pin: ${xt_pin} # NO `inverted:` -- the BC337 already inverts
    bit_time: 545us # matches the ~1800 baud of the original interface board
    quantize: true # emit exactly on the 545 us bit grid

# The 38 kHz IR transmitter. `climate_ir` requires a `remote_transmitter:`
# instance to exist, which is why this block is here even with no LED fitted --
# ${ir_led_pin} then simply stays unconnected. With an LED you get a second
# control path for free.
remote_transmitter:
  id: ir_tx
  pin: ${ir_led_pin}
  carrier_duty_percent: 50%

# =============================================================================
#  FEEDBACK (optional -- only enable after measuring REC!)
# -----------------------------------------------------------------------------
#  REC carries the demodulated output of the unit's own IR receiver. The ESP
#  therefore sees what someone presses on the original remote, and Home
#  Assistant stays in sync. This is COMMAND feedback, not STATE feedback --
#  see docs/05-wegentscheidung.md.
# =============================================================================
# remote_receiver:
#   id: rec_rx
#   pin:
#     number: ${rec_pin}
#     inverted: true          # demodulated IR is active-low
#     mode:
#       input: true
#   tolerance: 30%
#   idle: 15ms
#   buffer_size: 2kB

# =============================================================================
#  CLIMATE ENTITY
# =============================================================================
climate:
  - platform: coolix
    name: "AC"
    id: ac
    # THIS line switches between wired and IR:
    #   xt_tx = wired (internal)   |   ir_tx = 38 kHz IR (external)
    transmitter_id: xt_tx
    # receiver_id: rec_rx            # together with remote_receiver above
    supports_cool: true
    supports_heat: true
    # Room temperature from a real sensor instead of the return-air probe.
    sensor: room_temperature
    visual:
      min_temperature: 17 °C
      max_temperature: 30 °C
      temperature_step: 1 °C

# =============================================================================
#  ROOM SENSOR
# =============================================================================
i2c:
  sda: ${sda_pin}
  scl: ${scl_pin}
  scan: true

sensor:
  - platform: bme280_i2c
    address: 0x76 # 0x77 if SDO is tied to VCC
    update_interval: 30s
    temperature:
      name: "Room temperature"
      id: room_temperature
      filters:
        - offset: 0.0 # calibrate against a reference thermometer if needed
    humidity:
      name: "Room humidity"
    pressure:
      name: "Air pressure"

  - platform: wifi_signal
    name: "Wi-Fi signal"
    update_interval: 120s

# =============================================================================
#  EXTRA COMMANDS the climate card does not cover
# =============================================================================
button:
  - platform: template
    name: "Toggle display LED"
    icon: mdi:lightbulb-night
    on_press:
      - remote_transmitter.transmit_coolix:
          transmitter_id: xt_tx
          first: 0xB5F5A5

  - platform: template
    name: "Toggle silence/feel"
    icon: mdi:volume-low
    on_press:
      - remote_transmitter.transmit_coolix:
          transmitter_id: xt_tx
          first: 0xB5F5B6
